# Puente gz <-> ROS 2 (ros_gz_bridge). Los nombres de gz salen de delorian.gazebo.xacro.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/oak/rgb/image_raw"
  gz_topic_name: "/oak/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/oak/depth/image_raw"
  gz_topic_name: "/oak/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/oak/rgb/camera_info"
  gz_topic_name: "/oak/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Misma calibración para la profundidad (en gz la rgbd_camera tiene una sola)
- ros_topic_name: "/oak/depth/camera_info"
  gz_topic_name: "/oak/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# /oak/depth/points no se puentea: gz la publica con x adelante pero con el frame óptico
# (z adelante), así que salía girada. La genera depth_image_proc en sim.launch.py a
# partir de la imagen de profundidad, igual que con la OAK-D real.

- ros_topic_name: "/odometry/wheel"
  gz_topic_name: "/odometry/wheel"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# La TF odom -> base_footprint del DiffDrive (/tf de gz) se puentea aparte en
# sim.launch.py, solo con odom_tf:=true, para no chocar con el EKF de robot_localization.

- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu/data"
  gz_topic_name: "/imu/data"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
  
- ros_topic_name: "/gps/fix"
  gz_topic_name: "/gps/fix"
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS

- ros_topic_name: "/odometry/ground_truth"
  gz_topic_name: "/odometry/ground_truth"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS